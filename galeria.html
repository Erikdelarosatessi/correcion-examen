<!DOCTYPE html>

<body>

    <nav>

    <main>
        <h2>Rutes en bici per Mallorca</h2>
        <div class="galeria">
            <figure>
                <img src="img/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la serra de Tramuntana">
                <figcaption>Sa Calobra <span class="km">· 38 km</span></figcaption>

            <figure>
                <img src="img/formentor.jpg" alt="Far de Cap de Formentor sobre penya-segats amb vistes al mar">

            </figure>
            <figure>
                <img src="img/valldemossa.jpg" alt="Poble de Valldemossa amb el campanar de l'església i cases de pedra">

            </figure>
            <figure>

            <figure>

            <figure>

            </figure>
            <figure>
                <img src="img/pollenca.jpg" alt="Antic pont romà de pedra sobre un torrent a Pollença">
                <figcaption>Pont romà de Pollença <span class="km">· 20 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/salines.jpg" alt="Paisatge natural de les Salines amb zones humides i vegetació">
                <figcaption>Ses Salines <span class="km">· 32 km</span></figcaption>
            </figure>
